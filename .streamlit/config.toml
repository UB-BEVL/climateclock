[client]
showErrorDetails = true
toolbarMode = "minimal"

[logger]
level = "info"

[server]
headless = true
port = 8501
enableXsrfProtection = true
runOnSave = false
maxUploadSize = 200
enableCORS = false

[theme]
primaryColor = "#0d47a1"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
font = "sans serif"
